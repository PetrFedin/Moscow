name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run build:web
