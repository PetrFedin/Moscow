name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install
      - run: npm run test:e2e-contract
      - run: npm run typecheck
      - run: npm run build:web
      - run: npm run build:ios
      - run: npm run build:android
      - name: Smoke preview bundle
        run: |
          npm run serve:web > /tmp/moscow-preview.log 2>&1 &
          PID=$!
          sleep 3
          curl --fail --silent http://127.0.0.1:3000/ > /tmp/moscow-index.html
          test -s /tmp/moscow-index.html
          kill $PID
