name: quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm install
      - name: Generic GLB reporter smoke
        run: |
          node scripts/report_glb_asset.mjs assets/models/romanov-1857-documented-v1.glb > /tmp/glb-report.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/glb-report.json','utf8')); if(r.format!=='glb'||r.glbVersion!==2||r.bytes<=0||!/^[a-f0-9]{64}$/.test(r.sha256)) process.exit(1)"
      - name: Romanov model mobile performance gate
        run: node scripts/check_romanov_model_performance.mjs
      - name: Pilot cohort CLI smoke
        run: node --experimental-strip-types scripts/aggregate_pilot_reports.mjs --help
      - name: Pilot study CLI smoke
        run: node --experimental-strip-types scripts/build_pilot_study_report.mjs --help
      - name: Government delivery readiness CLI smoke
        run: node --experimental-strip-types scripts/report_government_delivery_readiness.mjs --help
      - name: Moscow pilot application readiness CLI smoke
        run: node --experimental-strip-types scripts/report_moscow_pilot_application_readiness.mjs --help
      - name: Provider proof remains locked without real evidence
        run: |
          set +e
          npm run provider:proof-status > /tmp/provider-proof.json
          status=$?
          set -e
          test "$status" -eq 2
          node -e "const fs=require('fs'); const raw=fs.readFileSync('/tmp/provider-proof.json','utf8'); const json=JSON.parse(raw.slice(raw.indexOf('{'))); if(json.gate.status!=='blocked'||json.gate.evidenceSigningAuthority!=='locked') process.exit(1)"
      - run: npm run test:e2e-contract
      - run: npm run typecheck
      - run: npm run build:web
      - run: npm run build:ios
      - run: npm run build:android
      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium
      - name: Browser E2E journey
        run: npm run test:e2e-web
      - name: Visual acceptance captures (375 / 768 / 1440)
        run: npx playwright test tests/visualAcceptance.e2e.spec.ts --project=chromium
      - name: Preserve and verify responsive screenshot evidence before next Playwright run
        run: |
          set -euo pipefail
          test -d test-results
          mkdir -p visual-evidence
          cp -a test-results/. visual-evidence/
          for viewport in phone-375 tablet-768 desktop-1440; do
            find visual-evidence -type f -name "${viewport}-trip-readiness-summary-viewport.png" -print -quit | grep -q .
            find visual-evidence -type f -name "${viewport}-trip-readiness-conflict-viewport.png" -print -quit | grep -q .
            find visual-evidence -type f -name "${viewport}-venue-service-wallet.png" -print -quit | grep -q .
            find visual-evidence -type f -name "${viewport}-trip-bottom-nav-clearance.png" -print -quit | grep -q .
            find visual-evidence -type f -name "${viewport}-map-bottom-nav-clearance.png" -print -quit | grep -q .
            find visual-evidence -type f -name "${viewport}-readiness-contextual-booking-assistance.png" -print -quit | grep -q .
            find visual-evidence -type f -name "${viewport}-trip-finance-budget-viewport.png" -print -quit | grep -q .
          done
          count=$(find visual-evidence -type f -name '*.png' | wc -l)
          echo "Preserved real Chromium screenshots: $count"
          test "$count" -ge 21
      - name: Real browser showcase capture (mobile / desktop)
        run: npx playwright test tests/showcaseCapture.e2e.spec.ts --project=chromium
      - name: Install FFmpeg for verified video exports
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Encode and verify four exact 25-second MP4 recordings
        run: |
          set -euo pipefail
          test -s showcase-evidence/videos/mobile-375-session.webm
          test -s showcase-evidence/videos/desktop-1440-session.webm
          test -s showcase-evidence/videos/services-375-session.webm
          test -s showcase-evidence/videos/budget-375-session.webm
          for profile in mobile-375 desktop-1440 services-375 budget-375; do
            source="showcase-evidence/videos/${profile}-session.webm"
            target="showcase-evidence/videos/${profile}-25s.mp4"
            ffmpeg -hide_banner -loglevel error -y -i "$source" -t 25 -an -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -movflags +faststart "$target"
            test -s "$target"
            duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$target")
            awk -v seconds="$duration" 'BEGIN { if (seconds < 24.5 || seconds > 25.2) exit 1 }'
          done
      - name: Upload web showcase screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moscow-showcase-${{ github.sha }}
          path: showcase-evidence/**/*
          retention-days: 30
          if-no-files-found: warn
      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moscow-visual-qa-${{ github.sha }}
          path: |
            visual-evidence/**/*
            test-results/**/*
          retention-days: 14
          if-no-files-found: warn
