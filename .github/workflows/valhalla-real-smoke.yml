name: valhalla-real-smoke

on:
  workflow_dispatch:

jobs:
  real-route-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run real Moscow walking route smoke
        env:
          VALHALLA_URL: https://valhalla1.openstreetmap.de
          VALHALLA_CLIENT_ID: moscow-city-journey-os
          ROUTING_EVIDENCE_OUT: evidence/valhalla-real-smoke.json
        run: |
          mkdir -p evidence
          npm run routing:valhalla-smoke

      - name: Upload routing evidence
        uses: actions/upload-artifact@v4
        with:
          name: valhalla-real-smoke-evidence
          path: evidence/valhalla-real-smoke.json
          if-no-files-found: error
          retention-days: 90
