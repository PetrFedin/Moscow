name: current-live-city-refresh

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/travel/liveCityRefreshRuntime.ts"
      - "src/travel/currentLiveCityClient.ts"
      - "scripts/live_city_refresh_runtime.mjs"
      - ".github/workflows/current-live-city-refresh.yml"
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    if: github.event_name != 'pull_request' || github.head_ref == 'current-live-refresh-runtime-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build current live city snapshot
        env:
          LIVE_CITY_REFRESH_OUT_DIR: evidence/live-city-current
        run: npm run live:refresh-runtime

      - name: Upload current live city snapshot
        uses: actions/upload-artifact@v4
        with:
          name: current-live-city-snapshot
          path: evidence/live-city-current/
          if-no-files-found: error
          retention-days: 7
