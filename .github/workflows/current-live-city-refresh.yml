name: current-live-city-refresh

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/current-live-city-refresh.yml"
      - "scripts/live_city_publication_server.mjs"
      - "scripts/live_city_refresh_runtime.mjs"
      - "scripts/publish_live_city_snapshot.mjs"
      - "src/travel/liveCityPublicationAuthority.ts"
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build current live city snapshot
        env:
          LIVE_CITY_REFRESH_OUT_DIR: evidence/live-city-current
        run: npm run live:refresh-runtime

      - name: Publish current snapshot to live authority
        env:
          LIVE_CITY_PUBLISH_URL: https://moscow-mobile-preview.onrender.com/live-city/publish
          LIVE_CITY_SNAPSHOT_PATH: evidence/live-city-current/current.json
          LIVE_CITY_PUBLISH_ATTEMPTS: "24"
          LIVE_CITY_PUBLISH_RETRY_DELAY_MS: "10000"
        run: npm run live:publish-current

      - name: Upload current live city snapshot
        uses: actions/upload-artifact@v4
        with:
          name: current-live-city-snapshot
          path: evidence/live-city-current/
          if-no-files-found: error
          retention-days: 7
