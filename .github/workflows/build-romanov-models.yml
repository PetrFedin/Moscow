name: build-romanov-models

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_romanov_production_candidate_v1.py
      - requirements-3d.txt
      - .github/workflows/build-romanov-models.yml

permissions:
  contents: write

jobs:
  build-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-3d.txt
      - run: python scripts/build_romanov_production_candidate_v1.py
      - name: Commit generated model pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/romanov-1857-production-candidate-v1.glb
          git add assets/models/romanov-1857-production-candidate-v1.gltf
          git add assets/models/romanov-1859-production-candidate-v1.glb
          git add assets/models/romanov-1859-production-candidate-v1.gltf
          git add assets/models/romanov-production-candidate-v1.manifest.json
          if git diff --cached --quiet; then
            echo "Generated models unchanged"
          else
            git commit -m "Build Romanov production-candidate model pack"
            git push
          fi
